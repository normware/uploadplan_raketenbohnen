<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBTV Wochenplan</title>
<link rel="stylesheet" href="css/asta.min.css">
<style>
:root {
  --red: #d00;
  --blue: #00d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --red: #ff5050; --blue: #9090ff; }
}
:root[data-theme="dark"] { --red: #ff5050; --blue: #9090ff; }

*+* { margin-top: 0; }

header, main { max-width: 80ch; margin: 0 auto; padding: 0 2ch; }
main { margin-top: var(--line-height); }
@media (max-width: 600px) {
  header, main { padding: 0 1ch; }

  .schedule-table,
  .schedule-table tbody { display: block; }
  .schedule-table thead { display: none; }

  .schedule-table tr {
    display: flex;
    flex-wrap: wrap;
    border: none;
    padding: 0.35em 0;
    gap: 0 0.5em;
  }
  .schedule-table tr.subrow {
    padding: 0 0 0 1.2em;
    border: none;
  }

  .schedule-table td {
    border: none;
    padding: 0;
    white-space: normal;
    width: auto;
    word-break: break-word;
    line-height: 1.4;
  }
  .schedule-table td:first-child { white-space: nowrap; }
  .schedule-table td:nth-child(2) { white-space: nowrap; }
  .schedule-table td:nth-child(3) { flex: 1 1 100%; }
  .schedule-table tr:not(.subrow) { border-bottom: 1px solid var(--text-color); }

  .schedule-table tr.subrow td { flex: 1 1 100%; font-size: 0.85rem; }
  .schedule-table tr.subrow td:empty { display: none; }
}

.theme-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 1ch;
  margin-bottom: var(--spacing-1);
}
.theme-bar .gh-link {
  display: flex;
  align-items: center;
  color: var(--text-color-alt);
  text-decoration: none;
}
.theme-bar .gh-link:hover {
  color: var(--text-color);
}

.week-nav {
  display: flex;
  align-items: center;
  gap: 1ch;
  margin: var(--spacing-half) 0;
}
.week-nav button {
  border: 1px solid var(--text-color-alt);
  background: none;
  color: var(--text-color);
  cursor: pointer;
  padding: 0 0.75ch;
  line-height: var(--line-height);
  font: inherit;
  font-size: 0.85rem;
}
.week-nav button:hover {
  background: var(--background-color-alt);
}
.week-nav .week-label {
  min-width: 10ch;
  text-align: center;
  font-weight: 700;
}
.week-nav .today-btn {
  margin-left: auto;
  border-color: var(--blue);
  color: var(--blue);
}

.tab-bar {
  display: flex;
  gap: 2ch;
  margin: var(--spacing-1) 0 var(--spacing-2);
}
.tab-bar a { color: var(--blue); text-decoration: none; cursor: pointer; }
.tab-bar a:hover { text-decoration: underline; }
.tab-bar a.active { text-decoration: underline; font-weight: 700; }

.schedule {
  margin: 0 0 var(--spacing-2);
}
.schedule h2 {
  margin: 0 0 0;
  font-size: 1rem;
}

.schedule-table {
  width: 100%;
  margin: 0;
  border-collapse: collapse;
}
.schedule-table th,
.schedule-table td {
  border: 1px solid var(--text-color);
  padding: calc(var(--line-height)/4) 0.5ch;
  line-height: 1.2;
  vertical-align: top;
  text-align: left;
  font-weight: 400;
}
.schedule-table thead th {
  font-weight: 700;
}
.schedule-table td:first-child,
.schedule-table th:first-child { white-space: nowrap; width: 13ch; }
.schedule-table td:nth-child(2),
.schedule-table th:nth-child(2) { white-space: nowrap; width: 7ch; }
.col-title { word-break: break-word; }

.schedule-table tr.subrow td {
  border-top: none;
  padding-top: 1px;
}
.schedule-table tr.subrow td:empty {
  visibility: hidden;
}

.text-red { color: var(--red); }
.text-blue { color: var(--blue); }
.text-gray { color: var(--text-color-alt); }
.font-bold { font-weight: 800; }

a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div class="theme-bar">
    <a class="gh-link" href="https://github.com/normware/uploadplan_raketenbohnen" target="_blank" title="GitHub">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
    <label class="theme-toggle-label">
      <input type="checkbox" class="theme-toggle">
    </label>
  </div>
  <h1>RBTV Wochenplan</h1>
  <p class="text-gray">[L]=live &nbsp; [U]=upload</p>
  <div class="week-nav">
    <button onclick="goWeek(-1)" title="vorherige woche">←</button>
    <span class="week-label" id="week-label">–</span>
    <button onclick="goWeek(1)" title="nächste woche">→</button>
    <button class="today-btn" onclick="goToday()">heute</button>
  </div>
  <nav class="tab-bar" id="tabs"></nav>
</header>

<main id="app">loading...</main>

<script src="js/asta.min.js"></script>
<script>
const DAYS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MODES=[['all','alle'],['live','livestream'],['upload','upload']];

function fmt(s){const d=new Date(s);return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}
function fmtDay(s){const d=new Date(s);return DAYS[d.getDay()]+' '+d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
function isNow(a,b){const n=Date.now();return n>=new Date(a)&&n<=new Date(b);}
function trunc(s,len){return s&&s.length>len?s.slice(0,len-2)+'..':s;}

function groupByDay(els,dateKey){
  const m={};
  for(const el of els){
    const k=fmtDay(el[dateKey]||el.timeStart||el.uploadDate);
    if(!m[k])m[k]=[];
    m[k].push(el);
  }
  return m;
}
function sortKey(s){
  const[,d,mo]=s.match(/(\d+)\.(\d+)/)||[];
  return parseInt(mo)*100+parseInt(d);
}

function esc(s){
  return String(s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});
}
function typeClass(type){
  return type==='[L]'?'text-red':'text-blue';
}

function dayTable(day, items){
  let rows='';
  items.forEach(({type,el},i)=>{
    if(type==='live'){
      const now=isNow(el.timeStart,el.timeEnd);
      const timeStr=fmt(el.timeStart)+'-'+fmt(el.timeEnd);
      const bohnen=(el.bohnen||[]).map(b=>esc(b.name)).join(', ');
      const titleCls=now?'text-red font-bold':'';
      rows+=`<tr><td class="text-gray">${timeStr}</td><td class="${typeClass('[L]')}">[L]</td><td class="${titleCls}">${esc(trunc(el.title,60))}</td></tr>\n`;
      if(el.topic) rows+=`<tr class="subrow"><td></td><td></td><td class="text-gray">${esc(trunc(el.topic,60))}</td></tr>\n`;
      if(bohnen) rows+=`<tr class="subrow"><td></td><td></td><td class="text-gray">${bohnen}</td></tr>\n`;
    } else {
      const yt=(el.tokens||[]).find(t=>t.type==='youtube');
      const upTime=el.publishingDate||el.uploadDate;
      const bohnen=(el.bohnen||[]).map(b=>esc(b.name)).join(', ');
      rows+=`<tr><td class="text-gray">${fmt(upTime)}</td><td class="text-blue">[U]</td><td>${esc(trunc(el.title,60))}</td></tr>\n`;
      if(el.showTitle) rows+=`<tr class="subrow"><td></td><td></td><td class="text-gray">${esc(trunc(el.showTitle,60))}</td></tr>\n`;
      if(bohnen) rows+=`<tr class="subrow"><td></td><td></td><td class="text-gray">${bohnen}</td></tr>\n`;
      if(yt) rows+=`<tr class="subrow"><td></td><td></td><td class="text-gray"><a href="https://www.youtube.com/watch?v=${esc(yt.token)}" target="_blank">youtube↗</a></td></tr>\n`;
    }
  });

  return `<section class="schedule" id="day-${esc(day).replace(/\s/g,'_')}">
<h2 class="font-bold">${day}</h2>
<table class="schedule-table">
<thead><tr><th class="col-time">ZEIT</th><th class="col-type">TYP</th><th class="col-title">TITEL</th></tr></thead>
<tbody>${rows}</tbody>
</table>
</section>`;
}

let lbd={},ubd={},allDays=[],curMode='all',weekOffset=0,loadId=0;

function getWeekNumber(d){
  const t=new Date(d);t.setDate(t.getDate()+3-(t.getDay()+6)%7);
  const y=t.getFullYear();const w=Math.floor((t-new Date(y,0,4))/864e5/7+1);
  return `KW ${w}/${y}`;
}

function goWeek(delta){
  weekOffset+=delta;
  load(weekOffset);
}

function goToday(){
  weekOffset=0;
  load(0,true);
}

function render(mode){
  curMode=mode;
  const tabBar=document.getElementById('tabs');
  tabBar.innerHTML=MODES.map(([m,l])=>`<a href="#"${m===mode?' class="active"':''} onclick="sw('${m}');return false">${l}</a>`).join('');

  let out='';
  for(const day of allDays){
    const lives=lbd[day]||[];
    const uploads=ubd[day]||[];
    const items=[];
    if(mode!=='upload') lives.forEach(el=>items.push({type:'live',el}));
    if(mode!=='live')   uploads.forEach(el=>items.push({type:'upload',el}));
    if(!items.length) continue;
    out+=dayTable(day,items);
  }
  document.getElementById('app').innerHTML=out||'<p class="text-gray">keine einträge</p>';
}

window.sw=function(mode){render(mode);};

async function load(offset,scrollToToday){
  offset=offset||0;
  const id=++loadId;
  const now=new Date();
  const dow=now.getDay();
  const off=dow===0?-6:1-dow;
  const mon=new Date(now);
  mon.setDate(now.getDate()+off+offset*7);mon.setHours(0,0,0,0);
  const sun=new Date(mon);
  sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);
  document.getElementById('week-label').textContent=getWeekNumber(mon);
  const s=Math.floor(mon.getTime()/1000);
  const e=Math.floor(sun.getTime()/1000)+86400;
  try{
    const [lr,ur]=await Promise.all([
      fetch(`https://api.rocketbeans.tv/v1/schedule?startDay=${s}&endDay=${e}`),
      fetch(`https://api.rocketbeans.tv/v1/schedule/publish?from=${s}`)
    ]);
    const lj=await lr.json(),uj=await ur.json();
    const lives=[];
    if(lj.success&&lj.data&&lj.data[0])
      for(const d of lj.data[0].schedule)
        for(const el of d.elements)
          if(el.type==='live') lives.push(el);
    lives.sort((a,b)=>new Date(a.timeStart)-new Date(b.timeStart));
    const uploads=[];
    const ms=e*1000;
    if(uj.success)
      for(const d of uj.data)
        for(const el of d.elements){
          const u=new Date(el.uploadDate||el.publishingDate).getTime();
          if(u>=s*1000&&u<=ms) uploads.push(el);
        }
    uploads.sort((a,b)=>new Date(a.uploadDate||a.publishingDate)-new Date(b.uploadDate||b.publishingDate));
    lbd=groupByDay(lives,'timeStart');
    ubd=groupByDay(uploads,'uploadDate');
    allDays=[...new Set([...Object.keys(lbd),...Object.keys(ubd)])].sort((a,b)=>sortKey(a)-sortKey(b));
    if(id===loadId) render('all');
    if(id===loadId&&scrollToToday){
      const todayKey=DAYS[new Date().getDay()]+'_'+new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
      const el=document.getElementById('day-'+todayKey);
      if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    }
  }catch(err){
    if(id===loadId) document.getElementById('app').innerHTML=`<p class="text-red">error: ${err.message}</p>`;
  }
}
load(0);
</script>
